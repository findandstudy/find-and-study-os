        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "404": { description: Campaign not found }
        "409": { description: Campaign state or in-flight operation conflict }

  /social/ad-operations/{id}/review:
    post:
      operationId: reviewSocialAdOperation
      tags: [social]
      summary: Independently approve or reject an advertising operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ReviewSocialContentBriefBody" }
      responses:
        "200":
          description: Append-only review recorded; an approval makes the operation worker-eligible
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/SocialAdOperationReviewResult" }
        "400": { description: Invalid review or missing rejection reason }
        "401": { description: Authentication required }
        "403": { description: social.approve permission required }
        "409":
          {
            description: "Maker-checker, campaign state or idempotency conflict",
          }

  /social/ad-operations/{id}/cancel:
    post:
      operationId: cancelSocialAdOperation
      tags: [social]
      summary: Cancel an advertising operation before execution starts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200": { description: Operation canceled without provider traffic }
        "400": { description: Invalid operation id }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "404": { description: Operation not found }
        "409": { description: Operation has already started or completed }

  /social/ad-operations/{id}/attempts:
    get:
      operationId: listSocialAdOperationAttempts
      tags: [social]
      summary: List redacted provider execution attempts for an advertising operation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Redacted, append-only attempt evidence
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 50
                    items:
                      { $ref: "#/components/schemas/SocialAdOperationAttempt" }
        "400": { description: Invalid operation id }
        "401": { description: Authentication required }
        "403": { description: social.view permission required }

  /social/accounts:
    get:
      operationId: listSocialAccounts
      tags: [social]
      summary: List registered social accounts without secret material
      responses:
        "200":
          description: Social account registry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SocialAccount" }
        "401": { description: Authentication required }
        "403": { description: social.view permission required }
        "503":
          { description: Social operations scope is unavailable or disabled }
    post:
      operationId: createSocialAccount
      tags: [social]
      summary: Register a social account reference without storing its raw external identifier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSocialAccountBody" }
      responses:
        "201":
          description: Account reference registered as disconnected or unverified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialAccount" }
        "400": { description: Invalid account reference }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "409": { description: Account key already exists in this scope }
        "503":
          { description: Social operations scope is unavailable or disabled }

  /social/media/uploads/request-url:
    post:
      operationId: requestSocialMediaUpload
      tags: [social]
      summary: Request an uploader-bound temporary social media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialMediaUploadRequest" }
      responses:
        "200":
          description: Short-lived upload target issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialMediaUploadTarget" }
        "400": { description: Unsupported media metadata }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "429": { description: Upload request rate limit exceeded }
        "503": { description: Upload ownership binding unavailable }

  /social/media:
    post:
      operationId: registerSocialMediaAsset
      tags: [social]
      summary: Verify uploaded bytes and register an immutable media asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RegisterSocialMediaAssetBody" }
      responses:
        "201":
          description: Content-addressed media asset registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialMediaAsset" }
        "400": { description: Metadata or file signature mismatch }
        "401": { description: Authentication required }
        "403": { description: Asset is not owned by the current user }
        "404": { description: Temporary upload not found }
        "503": { description: Social operations scope is unavailable }

  /social/media/{id}/content:
    get:
      operationId: getSocialMediaAssetContent
      tags: [social]
      summary: Stream a tenant-authorized private social media asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private media bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        "400": { description: Invalid asset id }
        "401": { description: Authentication required }
        "403": { description: social.view permission required }
        "404": { description: Asset not found in the selected tenant scope }

  /social/briefs:
    post:
      operationId: createSocialContentBrief
      tags: [social]
      summary: Create a social content brief in DRAFT state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CreateSocialContentBriefBody" }
      responses:
        "201":
          description: Draft brief created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialContentBrief" }
        "400": { description: Invalid brief }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "503":
          { description: Social operations scope is unavailable or disabled }

  /social/briefs/{id}/submit:
    post:
      operationId: submitSocialContentBrief
      tags: [social]
      summary: Move a DRAFT brief to IN_REVIEW
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200":
          description: Brief submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialContentBrief" }
        "400": { description: Invalid brief id }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "409": { description: Brief is not in DRAFT state }
        "503":
          { description: Social operations scope is unavailable or disabled }

  /social/briefs/{id}/review:
    post:
      operationId: reviewSocialContentBrief
      tags: [social]
      summary: Approve or reject an IN_REVIEW brief using maker-checker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ReviewSocialContentBriefBody" }
      responses:
        "200":
          description: Append-only review decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialContentReviewResult" }
        "400": { description: Invalid review request }
        "401": { description: Authentication required }
        "403": { description: social.approve permission required }
        "409": { description: "Maker-checker, state or idempotency conflict" }
        "503":
          { description: Social operations scope is unavailable or disabled }

  /social/accounts/{id}/verify:
    post:
      operationId: verifySocialAccount
      tags: [social]
      summary: Verify an account through the explicitly enabled provider adapter
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200":
          description: Verification outcome recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialAccountVerificationResult" }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "409": { description: Verification state or idempotency conflict }
        "503": { description: Provider connectivity is disabled }

  /social/publications:
    get:
      operationId: listSocialPublications
      tags: [social]
      summary: List publication intents in the selected tenant scope
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SocialPublicationStatus" }
      responses:
        "200":
          description: Publication intents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPublicationListResponse" }
        "401": { description: Authentication required }
        "403": { description: social.view permission required }
    post:
      operationId: createSocialPublication
      tags: [social]
      summary: Create a draft publication intent from an approved brief and verified account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSocialPublicationBody" }
      responses:
        "201":
          description: Draft publication intent created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPublication" }
        "400": { description: Invalid request or media preflight failure }
        "401": { description: Authentication required }
        "403": { description: social.manage permission required }
        "409": { description: "Brief, account or idempotency conflict" }

  /social/publications/{id}/submit:
    post:
      operationId: submitSocialPublication
      tags: [social]
      summary: Submit a draft publication intent for maker-checker review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200":
          description: Publication submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPublication" }
        "400": { description: Invalid request }
        "409": { description: Publication is not in draft state }

  /social/publications/{id}/review:
    post:
      operationId: reviewSocialPublication
      tags: [social]
      summary: Approve or reject a publication intent using maker-checker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewSocialContentBriefBody" }
      responses:
        "200":
          description: Review decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialContentReviewResult" }
        "400": { description: Invalid request }
        "409": { description: "Maker-checker, state or idempotency conflict" }

  /social/publications/{id}/attempts:
    get:
      operationId: listSocialPublicationAttempts
      tags: [social]
      summary: List immutable worker attempts for a publication
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Publication attempts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SocialPublicationAttempt" }
        "400": { description: Invalid publication id }

  /social/publications/{id}/cancel:
    post:
      operationId: cancelSocialPublication
      tags: [social]
      summary: Cancel a publication that has not started executing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200":
          description: Publication canceled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPublication" }
        "400": { description: Invalid request }
        "409": { description: Publication cannot be canceled in its current state }

  /social/performance:
    get:
      operationId: listSocialPerformance
      tags: [social]
      summary: List latest receipt-backed performance snapshots
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Latest performance snapshots and collection gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPerformanceResponse" }
        "401": { description: Authentication required }
        "403": { description: social.view permission required }

  /social/performance/{id}/sync:
    post:
      operationId: requestSocialPerformanceSync
      tags: [social]
      summary: Queue a bounded performance refresh for a published item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitSocialOperationBody" }
      responses:
        "200":
          description: Performance refresh queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialPerformanceSyncResult" }
        "400": { description: Invalid request }
        "404": { description: Published item not found }
        "409": { description: A refresh is already running }

components:
  parameters:
    ReportingFrom:
      name: from
      in: query
      description: Inclusive UTC calendar date; defaults to 29 days before today.
      schema: { type: string, format: date }
    ReportingTo:
      name: to
      in: query
      description: Inclusive UTC calendar date; the server converts it to an exclusive next-day boundary.
      schema: { type: string, format: date }
    ReportingSeason:
      name: season
      in: query
      description: Optional four-digit application season.
      schema: { type: string, pattern: "^[0-9]{4}$" }
    ReportingBranchId:
      name: branchId
      in: query
      description: Optional branch inside the server-resolved actor scope.
      schema: { type: integer, minimum: 1 }
  responses:
    ReportingInvalidFilter:
      description: Invalid or over-broad reporting filter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReportingUnauthenticated:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReportingForbidden:
      description: Missing permission or branch outside the actor scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReportingUnavailable:
      description: Reporting data is unavailable or exceeded its query budget
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReportingNullablePercent:
      type: [number, "null"]
      minimum: 0
      maximum: 100
      description: Null means the denominator is zero or unavailable; zero is a measured 0%.
    ReportingResponseMeta:
      type: object
      required:
        [
          schemaVersion,
          metricVersion,
          asOf,
          filters,
          freshness,
          latencyMs,
          warnings,
          privacy,
        ]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        metricVersion: { type: string }
        asOf: { type: string, format: date-time }
        filters:
          type: object
          required: [from, to, season, branchId, timezone, endBoundary]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            season: { type: [string, "null"] }
            branchId: { type: [integer, "null"] }
            timezone: { type: string, const: UTC }
            endBoundary: { type: string, const: inclusive }
        freshness:
          type: object
          required: [status, source, cacheAgeSeconds]
          properties:
            status: { type: string, const: live }
            source: { type: string }
            cacheAgeSeconds: { type: integer, minimum: 0 }
        latencyMs: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
        privacy: { type: string, const: aggregate_non_personal }
    ReportingMetricDefinition:
      type: object
      required:
        [key, label, domain, description, grain, timeSemantics, sensitivity]
      properties:
        key: { type: string }
        label: { type: string }
        domain:
          {
            type: string,
            enum: [executive, funnel, applications, finance, data_quality],
          }
        description: { type: string }
        grain: { type: string, enum: [record, application, currency, issue] }
        timeSemantics:
          {
            type: string,
            enum:
              [
                created_cohort,
                financial_event,
                current_inventory,
                global_snapshot,
              ],
          }
        denominator: { type: string }
        sensitivity: { type: string, const: aggregate_non_personal }
    ReportingMetaResponse:
      type: object
      required:
        [
          schemaVersion,
          metricVersion,
          generatedAt,
          timezone,
          maximumRangeDays,
          currencyPolicy,
          exportPolicy,
          metrics,
          branches,
        ]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        metricVersion: { type: string }
        generatedAt: { type: string, format: date-time }
        timezone: { type: string, const: UTC }
        maximumRangeDays: { type: integer, const: 366 }
        currencyPolicy:
          { type: string, const: original_currency_only_no_cross_currency_sum }
        exportPolicy:
          {
            type: string,
            const: disabled_in_v1_until_audited_field_level_export_is_approved,
          }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ReportingMetricDefinition" }
        branches:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, name, country, city]
            properties:
              id: { type: integer }
              name: { type: string }
              country: { type: [string, "null"] }
              city: { type: [string, "null"] }
    ReportingCommandCenterResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ReportingResponseMeta" }
        data:
          type: object
          required: [cards, trendBucket, trend]
          properties:
            cards:
              type: object
              required:
                [
                  leadsCreated,
                  leadsChangePercent,
                  leadConversionRate,
                  studentsCreated,
                  studentsChangePercent,
                  applicationsCreated,
                  applicationsChangePercent,
                  applicationWinRate,
                  activeApplications,
                  staleApplications,
                ]
              properties:
                leadsCreated: { type: integer, minimum: 0 }
                leadsChangePercent: { type: [number, "null"] }
                leadConversionRate:
                  { $ref: "#/components/schemas/ReportingNullablePercent" }
                studentsCreated: { type: integer, minimum: 0 }
                studentsChangePercent: { type: [number, "null"] }
                applicationsCreated: { type: integer, minimum: 0 }
                applicationsChangePercent: { type: [number, "null"] }
                applicationWinRate:
                  { $ref: "#/components/schemas/ReportingNullablePercent" }
                activeApplications: { type: integer, minimum: 0 }
                staleApplications: { type: integer, minimum: 0 }
            trendBucket: { type: string, enum: [day, week, month] }
            trend:
              type: array
              items:
                type: object
                required: [bucket, leads, students, applications]
                properties:
                  bucket: { type: string, format: date-time }
                  leads: { type: integer, minimum: 0 }
                  students: { type: integer, minimum: 0 }
                  applications: { type: integer, minimum: 0 }
    ReportingFunnelResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ReportingResponseMeta" }
        data:
          type: object
          required: [stages, lost, sources]
          properties:
            stages:
              type: array
              items:
                type: object
                required: [key, value, rateFromPrevious]
                properties:
                  key: { type: string }
                  value: { type: integer, minimum: 0 }
                  rateFromPrevious:
                    { $ref: "#/components/schemas/ReportingNullablePercent" }
            lost: { type: integer, minimum: 0 }
            sources:
              type: array
              maxItems: 20
              items:
                type: object
                required:
                  [
                    source,
                    leads,
                    converted,
                    applications,
                    won,
                    leadConversionRate,
                    applicationWinRate,
                  ]
                properties:
                  source: { type: string }
                  leads: { type: integer, minimum: 0 }
                  converted: { type: integer, minimum: 0 }
                  applications: { type: integer, minimum: 0 }
                  won: { type: integer, minimum: 0 }
                  leadConversionRate:
                    { $ref: "#/components/schemas/ReportingNullablePercent" }
                  applicationWinRate:
                    { $ref: "#/components/schemas/ReportingNullablePercent" }
    ReportingApplicationsResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ReportingResponseMeta" }
        data:
          type: object
          required: [totals, stages, lastUpdatedAging, destinations]
          properties:
            totals:
              type: object
              required: [inventory, createdCohort]
              properties:
                inventory: { type: integer, minimum: 0 }
                createdCohort: { type: integer, minimum: 0 }
            stages:
              type: array
              items:
                type: object
                required: [key, label, variant, inventory, cohort]
                properties:
                  key: { type: string }
                  label: { type: string }
                  variant: { type: string }
                  inventory: { type: integer, minimum: 0 }
                  cohort: { type: integer, minimum: 0 }
            lastUpdatedAging:
              type: array
              items:
                type: object
                required: [bucket, value]
                properties:
                  bucket:
                    { type: string, enum: [0-2d, 3-7d, 8-14d, 15-30d, 31d+] }
                  value: { type: integer, minimum: 0 }
            destinations:
              type: array
              maxItems: 20
              items:
                type: object
                required: [destination, applications, won, winRate]
                properties:
                  destination: { type: string }
                  applications: { type: integer, minimum: 0 }
                  won: { type: integer, minimum: 0 }
                  winRate:
                    { $ref: "#/components/schemas/ReportingNullablePercent" }
    ReportingCommissionByCurrency:
      type: object
      required:
        [
          currency,
          records,
          grossCommission,
          agentLiability,
          netCommission,
          collected,
          outstanding,
        ]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        records: { type: integer, minimum: 0 }
        grossCommission: { type: number }
        agentLiability: { type: number }
        netCommission: { type: number }
        collected: { type: number }
        outstanding: { type: number }
    ReportingServiceFeeByCurrency:
      type: object
      required: [currency, records, billed, collected, outstanding]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        records: { type: integer, minimum: 0 }
        billed: { type: number }
        collected: { type: number }
        outstanding: { type: number }
    ReportingFinanceResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ReportingResponseMeta" }
        data:
          type: object
          required: [currencyPolicy, commissions, serviceFees, transactions]
          properties:
            currencyPolicy:
              {
                type: string,
                const: original_currency_only_no_cross_currency_sum,
              }
            commissions:
              type: array
              items:
                { $ref: "#/components/schemas/ReportingCommissionByCurrency" }
            serviceFees:
              type: array
              items:
                { $ref: "#/components/schemas/ReportingServiceFeeByCurrency" }
            transactions:
              type: array
              items:
                type: object
                required: [currency, type, records, amount]
                properties:
                  currency: { type: string, pattern: "^[A-Z]{3}$" }
                  type: { type: string }
                  records: { type: integer, minimum: 0 }
                  amount: { type: number }
    ReportingDataQualityResponse:
      type: object
      required: [meta, data]
      properties:
        meta: { $ref: "#/components/schemas/ReportingResponseMeta" }
        data:
          type: object
          required: [coverage, summary, checks, mutationAvailable]
          properties:
            coverage:
              type: object
              required:
                [
                  leadSourcePercent,
                  applicationLeadLineagePercent,
                  applicationCatalogLinkPercent,
                ]
              properties:
                leadSourcePercent:
                  { $ref: "#/components/schemas/ReportingNullablePercent" }
                applicationLeadLineagePercent:
