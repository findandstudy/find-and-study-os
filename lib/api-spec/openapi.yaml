      summary: Read a redacted worker-job status projection
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private no-store job status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalWorkerJob" }
        "404":
          description: Job not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

