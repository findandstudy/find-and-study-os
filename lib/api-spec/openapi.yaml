    delete:
      operationId: deletePortalCredentials
      tags: [portal-automation]
      summary: Soft-delete stored credentials for a university portal (admin only)
      parameters:
        - name: portalKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Credentials deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: No active credentials found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-automation/universities/{key}/program-options:
    get:
      operationId: getPortalProgramOptions
      tags: [portal-automation]
      summary: Live portal program options (cached, TTL 24h) for the program mapping editor (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: level
          in: query
          required: false
          schema: { type: string }
        - name: refresh
          in: query
          required: false
          description: Set to 1 to force a live refetch, bypassing the cache.
          schema: { type: integer, enum: [0, 1] }
      responses:
        "200":
          description: Program options (served from cache or freshly fetched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalProgramOptionsResponse"
        "404":
          description: University or adapter not found
          content:
