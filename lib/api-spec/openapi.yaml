          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalWorkerJobAccepted" }
        "404":
          description: Portal university not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: A matching healthy worker is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

