        attempt_count: { type: integer, minimum: 0, maximum: 120 }
        failure_count: { type: integer, minimum: 0, maximum: 5 }
        max_attempts: { type: integer, minimum: 1, maximum: 5 }
        next_attempt_at: { type: [string, "null"], format: date-time }
        result_caption: { type: [string, "null"] }
        generated_asset_id: { type: [string, "null"], format: uuid }
        generated_asset_path: { type: [string, "null"] }
        generated_asset_kind: { type: [string, "null"], enum: [image, video, null] }
        resolved_model: { type: [string, "null"] }
        usage:
          type: [object, "null"]
          additionalProperties: { oneOf: [{ type: number }, { type: string }] }
        applied_at: { type: [string, "null"], format: date-time }
        last_error_code: { type: [string, "null"] }
        created_by_legacy_user_id: { type: integer }
        approved_by_legacy_user_id: { type: [integer, "null"] }
        approved_at: { type: [string, "null"], format: date-time }
        rejection_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SocialCreativeListResponse:
      type: object
      required: [data, creativeGate]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/SocialCreativeRequest" }
        creativeGate: { $ref: "#/components/schemas/SocialCreativeGate" }

    SocialCreativeReviewResult:
      type: object
      required: [id, status, replay]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [APPROVED, REJECTED] }
        replay: { type: boolean }

    SocialPerformanceSyncResult:
      type: object
      required: [publicationId, status, nextSyncAt]
      properties:
        publicationId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE] }
        nextSyncAt: { type: string, format: date-time }
        replay: { type: boolean }

    ReviewSocialContentBriefBody:
      type: object
      additionalProperties: false
      required: [decision, requestKey]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        reason: { type: string, maxLength: 2000 }
        requestKey: { type: string, minLength: 8, maxLength: 160 }

    SubmitSocialOperationBody:
      type: object
      additionalProperties: false
      required: [requestKey]
      properties:
        requestKey:
          {
            type: string,
            minLength: 8,
            maxLength: 160,
            pattern: "^[A-Za-z0-9._:-]+$",
          }

    SocialContentReviewResult:
      type: object
      required: [replay, decision]
      properties:
        replay: { type: boolean }
        decision: { type: string, enum: [APPROVE, REJECT] }
