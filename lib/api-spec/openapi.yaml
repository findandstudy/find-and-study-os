  # PORTAL AUTOMATION
  /applications/{appId}/portal-submissions:
    post:
      operationId: enqueuePortalSubmission
      tags: [portal-automation]
      summary: Enqueue a portal submission for an application
      parameters:
        - name: appId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueuePortalSubmissionBody"
      responses:
        "201":
          description: Submission queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmission"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Confirm required for real mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-automation/submit:
    post:
      operationId: manualSubmitPortal
      tags: [portal-automation]
      summary: Manually queue one or many applications for portal submission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualSubmitBody"
      responses:
        "200":
          description: Nothing newly queued (all skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualSubmitResult"
        "201":
          description: One or more submissions queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualSubmitResult"
        "400":
          description: Application has no matching active portal university (single)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found or deleted (single)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Confirm required for real mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many submissions, rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-automation/apply-to-all:
    post:
      operationId: applyToAllUniversities
      tags: [portal-automation]
      summary: Fan-out one application to all active portal universities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyToAllBody"
      responses:
        "200":
          description: Processed, nothing newly queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyToAllResult"
        "201":
          description: One or more submissions queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyToAllResult"
        "404":
          description: Application not found or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Confirm required for real mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many submissions, rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-automation/eligible-applications:
    get:
      operationId: getEligibleApplications
      tags: [portal-automation]
      summary: List applications eligible for manual portal submission
      parameters:
        - name: stage
          in: query
          schema: { type: string }
        - name: universityKey
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated list of eligible applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EligibleApplication"
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                required: [data, total, page, limit, totalPages]

  /portal-submissions:
    get:
      operationId: getPortalSubmissions
      tags: [portal-automation]
      summary: List portal submissions (paginated)
      parameters:
        - name: applicationId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum:
              [
                queued,
                running,
                submitted,
                already_exists,
                program_missing,
                failed,
                canceled,
              ]
        - name: mode
          in: query
          schema:
            type: string
            enum: [dry, real]
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortalSubmission"
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                required: [data, total, page, limit, totalPages]

  /portal-submissions/{id}:
    get:
      operationId: getPortalSubmission
      tags: [portal-automation]
      summary: Get a single portal submission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Portal submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSubmission"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-submissions/{id}/retry:
    post:
      operationId: retryPortalSubmission
      tags: [portal-automation]
      summary: Retry a failed or canceled portal submission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Retried
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-submissions/{id}/ai-diagnose:
    post:
      operationId: diagnosePortalSubmissionWithAi
      tags: [portal-automation]
      summary: Create a review-only AI diagnosis for a failed portal submission
      description: >
        Uses PII-safe failure evidence and creates an approval-queue proposal.
        This endpoint never retries a submission or mutates a university portal,
        application code, or an active adapter spec.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Diagnosis created or an identical diagnosis reused
          content:
            application/json:
              schema:
                type: object
                properties:
                  guardian:
                    type: object
                    additionalProperties: true
                required: [guardian]
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Guardian inactive, diagnosis in progress, or outcome not diagnosable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Daily Guardian run limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-submissions/{id}/cancel:
    post:
      operationId: cancelPortalSubmission
      tags: [portal-automation]
      summary: Cancel a queued portal submission
      description: Running browser actions are worker-owned and fail closed with HTTP 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Canceled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not cancelable, already worker-owned, or claimed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /portal-submissions/process-queued:
    post:
      operationId: requestPortalSubmissionQueueDrain
      tags: [portal-automation]
      summary: Ask the release-matched worker to drain queued submissions
      responses:
        "202":
          description: Request accepted; browser work remains asynchronous
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalQueueAccepted" }
        "503":
          description: A matching healthy worker is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal-submissions/{id}/process:
    post:
      operationId: requestPortalSubmissionProcessing
      tags: [portal-automation]
      summary: Ask the release-matched worker to process one queued submission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/PortalSubmissionProcessingAccepted",
                }
        "404":
          description: Submission not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Submission is not queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: A matching healthy worker is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal-submissions/reset-stuck:
    post:
      operationId: rejectApiOwnedPortalSubmissionRecovery
      tags: [portal-automation]
      summary: Fail-closed legacy endpoint for worker-owned stale recovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thresholdMinutes:
                  { type: integer, minimum: 1, maximum: 60, default: 10 }
      responses:
        "409":
          description: Recovery is owned exclusively by the release-matched worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal-submissions/bulk-retry:
    post:
      operationId: retryPortalSubmissions
      tags: [portal-automation]
      summary: Return retryable submissions to the queue after preflight
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalSubmissionIdsBody" }
      responses:
        "200":
          description: Retry selection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalBulkMutationResult" }

  /portal-submissions/bulk-cancel:
    post:
      operationId: cancelPortalSubmissions
      tags: [portal-automation]
      summary: Cancel queued submissions; running work stays worker-owned
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalSubmissionIdsBody" }
      responses:
        "200":
          description: Cancellation selection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalBulkMutationResult" }

  /portal-submissions/bulk-process:
    post:
      operationId: requestBulkPortalSubmissionProcessing
      tags: [portal-automation]
      summary: Ask the release-matched worker to process selected queued submissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalSubmissionIdsBody" }
      responses:
        "202":
          description: Selection accepted
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PortalBulkProcessingAccepted" }
        "503":
          description: A matching healthy worker is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal-lifecycle-proposals:
    get:
      operationId: getPortalLifecycleProposals
      tags: [portal-automation]
      summary: List immutable evidence-bound lifecycle proposals
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PortalLifecycleProposalStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Private no-store proposal queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      { $ref: "#/components/schemas/PortalLifecycleProposal" }
                required: [items]

  /portal-lifecycle-proposals/{id}/review:
    post:
      operationId: reviewPortalLifecycleProposal
      tags: [portal-automation]
      summary: Record one maker-checker decision and queue a bounded internal transition when eligible
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/PortalLifecycleProposalReviewBody" }
      responses:
        "200":
          description: Review persisted; response states whether bounded execution was queued
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/PortalLifecycleProposalReviewResult",
                }
        "404":
          description: Proposal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Maker-checker or immutable review conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /portal-worker-jobs/{id}:
    get:
      operationId: getPortalWorkerJob
