        One weekday's working window ("HH:mm" local times in the config
        timezone). end < start means the window runs past midnight into the
        next day and is owned by the day it starts on.
      properties:
        enabled:
          type: boolean
        start:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        end:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      required:
