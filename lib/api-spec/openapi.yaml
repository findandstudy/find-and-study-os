          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A release-matched status worker is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

